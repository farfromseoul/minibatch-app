# 카테고리 설정 묶음 (아키텍처 D23). 단계 코드는 job.json 의 category 로 이 파일을 읽는다.
# 카테고리를 늘릴 때는 이 폴더에 파일을 더한다. TTS·LLM 교체(providers.yaml)와는 따로 움직인다.
key: ai-it
title: AI·IT 개념 설명
audience: AI 서비스(ChatGPT·번역기·추천 등)를 써 봤지만 원리는 모르는 직장인·학생
script:                  # 대본 규칙 (2026-10-17 품질 개선: 가상 인물·판타지가 오글거리고 내용이 어렵다는 피드백)
  structure: "생활 속 질문(후킹 1문장) → 한 문장 정의(정확한 용어와 쉬운 풀이) → 작동 원리 2~3단계(실제로 일어나는 일) → 실제 서비스 예시 → 흔한 오해 하나 바로잡기 → 한 문장 요약"
  forbidden:
    - 가상 인물·캐릭터·판타지 설정(정령, 숲, 모험 등)
    - "'~가 물었습니다', '~가 답했습니다' 같은 지문"
    - 비유 두 개 이상, 설명 없이 비유만 하는 문장
    - 출처 없는 수치·통계
    - 과장·감탄 표현(완벽하게, 100%, 놀랍게도 등)
  max_sentence_chars: 40
review:
  rules: [기술 사실 오류, 처음 듣는 사람이 이해할 수 있는가, 실제 작동 순서와 예시가 있는가, 가상 인물·지문·오글거리는 표현, 과장, 모호한 표현]
  banned_words: ["100%", "완벽하게", "무조건", "절대로", "최고의"]   # 규칙 검사에서 경고
templates:               # scenes 단계가 고를 수 있는 템플릿 (render/src/scenes, app/schemas/templates.py)
  - TitleReveal
  - FlowDiagram
  - ComparisonCards
  - NeuralNetwork
  - SummaryScene
youtube:
  category_id: "28"      # 과학기술 (미확인: videoCategories.list 로 확인)
  disclosure: AI 도구로 대본과 음성을 만들었습니다
  # YouTube "변경되었거나 합성된 콘텐츠" 라벨. 템플릿만이면 의무는 아니지만 밝힌다 (2026-10-17 사용자 결정).
  # false 면 생성 클립이 있을 때만 신고한다. 실사가 아닌 콘텐츠의 라벨은 펼친 설명란에 보일 수 있다
  declare_synthetic: true
voices:                  # 엔진별 목소리. 없는 엔진이면 providers.yaml 의 기본값
  supertonic: M1
  melotts: KR
topic_generation:
  prompt_hint: 입문자가 자주 헷갈리는 AI·IT 개념
series:                  # 시리즈 끝 안내 (아키텍처 D26). 운영자가 자유롭게 고친다. 여러 개면 화마다 돌아가며 쓴다
  cta_next:              # 다음 화가 있을 때. {next_title} = 다음 화 제목, {series_title} = 시리즈 제목
    - "다음 이야기가 궁금하시면 이어지는 영상을 확인해 주세요."
    - "{next_title}, 다음 화에서 이어집니다!"
  cta_end:               # 마지막 화
    - "'{series_title}' 시리즈를 끝까지 봐 주셔서 고마워요!"
