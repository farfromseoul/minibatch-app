# 목록형 쇼츠 (아키텍처 D42, 목록형쇼츠 기획서). 주제 하나를 "진짜 쓸 건 N개" 식으로 꼽는 약 58초(52~64초) 단독 영상.
# format: listicle 이면 topic·script·scenes·timeline 단계가 목록형 경로로 간다. 같은 채널(MiniBatch)에 올린다.
key: listicle
title: 목록형 쇼츠 (N가지 꼽기)
format: listicle
theme: nova                # render 목록형 스타일 (2026-10-31 nova: 남색 바탕·민트·보라 빛, 진행 막대, 단어 단위 자막)
target_duration_sec: 58    # 2026-10-31: 45초는 장면이 2~4초마다 바뀌어 빠르다는 피드백 → 항목마다 문장 셋, 쉼을 둔다
duration_tolerance_sec: 6  # 52~64초
tts:
  speed: 0.93              # 말 빠르기 배수 (Supertonic 기본 1.05 가 빠르게 들림, 2026-10-31 사용자)
  speech_chars_per_sec: 6.3  # 문장 앞뒤 무음을 뺀 말 구간의 초당 글자(2026-10-31 실측: 짧은 3문장 1.05배 6.91·0.95배 6.18·0.9배 5.81, 0.93배 21문장 미리보기 약 6.6 → 6.3)
audience: 개발 도구·AI 서비스를 실제로 쓰는 개발자·직장인·학생
listicle:
  count: {default: 5, min: 3, max: 5}
  max_items_given: 5
  outro:                   # 끝 장면 문구 (없으면 정리 화면으로 끝). 여러 개면 작업 번호로 돌려 쓴다
    - {line: "저장해 두고 하나씩 써 보세요.", title: "저장해 두고 하나씩", subtitle: "오늘 하나만 써 봐도 충분해요"}
script:
  structure: "숫자 대비 첫마디(많다는 말 → 진짜 쓸 건 N개) → 항목마다: 이름과 한 줄 소개 + 무엇을 해 주는지 + 언제·어떻게 쓰는지 → 정리 1~2문장(누구에게 무엇부터)"
  forbidden:
    - 참고 자료에 없는 숫자·별 수·다운로드 수·저장소 주소
    - 존재하는지 확실하지 않은 도구·기능 이름
    - 과장·감탄 표현(혁명적, 미쳤다, 완벽하게, 무조건 등)
    - 가상 인물·지문
  max_sentence_chars: 30
review:
  rules: [사실 오류(없는 도구·기능, 틀린 이름), 참고 자료와 다른 숫자·이름, 항목 설명이 실제로 무엇을 해 주는지 구체적인가, 과장·낚시]
  banned_words: ["미쳤", "혁명적", "완벽하게", "무조건", "100%"]
templates:                 # 목록형 장면 (render/src/listicle, app/schemas/templates.py)
  - LHookClaim
  - LHookReveal
  - LItemCard
  - LChat
  - LSteps
  - LBeforeAfter
  - LTerminal
  - LStat
  - LIcon
  - LCompare
  - LRecap
  - LOutro
youtube:
  category_id: "28"
  disclosure: AI 도구로 대본과 음성을 만들었습니다
  declare_synthetic: true
voices:
  supertonic: M1
  melotts: KR
