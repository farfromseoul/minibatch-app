# 목록형 쇼츠 (아키텍처 D42, 목록형쇼츠 기획서). 주제 하나에서 N개(1~10)를 꼽는 단독 영상. 길이는 listicle.duration(개수에 따라).
# format: listicle 이면 topic·script·scenes·timeline 단계가 목록형 경로로 간다. 같은 채널(MiniBatch)에 올린다.
key: listicle
title: 목록형 쇼츠 (N가지 꼽기)
format: listicle
theme: noir                # 기본 테마 (추천 단어가 하나도 안 맞을 때). v1.4: 미니멀 noir
# 화면 테마 템플릿 (v1.3, 2026-10-31). 새 테마: render/src/listicle/themes/<name>.tsx 를 만들고 여기에 한 줄,
# 미리보기 content/themes/<name>.png 를 더한다. keywords 가 주제·항목 이름에 많이 맞는 테마를 추천한다(같으면 위에서부터)
themes:
  # v1.4 (2026-11-01 사용자: 단순하지만 깔끔하게) 미니멀 셋을 위에 둔다: 추천 단어 수가 같으면 위 테마를 고른다
  - {name: noir, label: 누아르, aliases: [누아르, 노아르, 블랙], mood: "검정 + 흰 글자 + 노랑 하나, 얇은 선", fits: "AI 도구·기능 추천 (기본)",
     keywords: [AI, 클로드, Claude, ChatGPT, GPT, 스킬, 플러그인, 기능, 도구, 서비스, 에이전트, MCP, 추천, 인기]}
  - {name: air, label: 에어, aliases: [에어, 화이트], mood: "밝은 흰 바탕 + 파랑 하나, 문서처럼 깨끗", fits: "개념·방법·차이 정리",
     keywords: [개념, 용어, 차이, 원리, 정리, 공부, 방법, 기초, 이해, 입문, 비교]}
  - {name: slate, label: 슬레이트, aliases: [슬레이트, 그레이], mood: "짙은 회색 + 라임 하나, 차분한 개발 도구", fits: "명령어·설정·실습",
     keywords: [터미널, CLI, 명령어, 커맨드, 셸, bash, zsh, git, 깃, 도커, docker, 설정, 단축키, 스크립트, npm, 리눅스]}
  - {name: nova, label: 노바, aliases: [노바], mood: "남색 + 민트·보라 빛, 유리 카드, 부드러움", fits: "AI 도구·서비스 추천",
     keywords: [AI, 클로드, Claude, ChatGPT, GPT, 스킬, 플러그인, 확장, 서비스, 에이전트, MCP]}
  - {name: paper, label: 페이퍼, aliases: [페이퍼, 종이], mood: "아이보리 종이, 명조 + 주홍, 잡지형", fits: "팁·방법·개념 정리",
     keywords: [개념, 용어, 차이, 원리, 정리, 공부, 방법, 기초, 읽는, 이해]}
  - {name: terminal, label: 터미널, aliases: [터미널], mood: "검정 + 형광 초록, 고정폭, 명령 출력", fits: "CLI·명령어·개발 팁",
     keywords: [터미널, CLI, 명령어, 커맨드, 셸, 쉘, bash, zsh, git, 깃, 리눅스, linux, 도커, docker, vim, npm, 단축키, 스크립트]}
  - {name: pop, label: 팝, aliases: [팝], mood: "원색 스티커, 굵은 테두리, 통통 튐", fits: "실수 모음·꿀팁",
     keywords: [실수, 꿀팁, 함정, 주의, 하지 마, 몰랐, 흔한, 습관, 잘못]}
target_duration_sec: 58    # listicle.duration 이 없을 때만. 2026-10-31: 45초는 장면이 2~4초마다 바뀌어 빠르다는 피드백
duration_tolerance_sec: 6  # 목표 ± 6초
tts:
  speed: 0.93              # 말 빠르기 배수 (Supertonic 기본 1.05 가 빠르게 들림, 2026-10-31 사용자)
  speech_chars_per_sec: 7.5  # 문장 앞뒤 무음을 뺀 말 구간의 초당 글자. 2026-10-31 실측: 긴 문장 미리보기 약 6.6, 실제 영상(12~15자 짧은 문장) 7.99 → 7.5. 어긋나도 timeline 이 쉼으로 맞춘다
audience: 개발 도구·AI 서비스를 실제로 쓰는 개발자·직장인·학생
listicle:
  count: {default: 5, min: 1, max: 10}   # v1.4 (2026-11-01 사용자: 1~10개)
  max_items_given: 10
  duration: {base: 22, per_item: 8}      # 목표 길이 = 22 + 8 × N 초 (1개 30초, 5개 62초, 10개 102초). 7개부터 항목 문장 2개
  outro:                   # 끝 장면 문구 (없으면 정리 화면으로 끝). 여러 개면 작업 번호로 돌려 쓴다
    - {line: "저장해 두고 하나씩 써 보세요.", title: "저장해 두고 하나씩", subtitle: "오늘 하나만 써 봐도 충분해요"}
script:
  structure: "첫마디(주제에 맞는 방식: 숫자 대비·질문·공감 상황·결과 먼저·오해 깨기·전후 비교 중 하나 → N개를 꼽는다는 말) → 항목마다: 이름과 한 줄 소개 + 무엇을 해 주는지 + 언제·어떻게 쓰는지 → 정리 1~2문장(누구에게 무엇부터)"
  forbidden:
    - 참고 자료에 없는 숫자·별 수·다운로드 수·저장소 주소
    - 존재하는지 확실하지 않은 도구·기능 이름
    - 과장·감탄 표현(혁명적, 미쳤다, 완벽하게, 무조건 등)
    - 가상 인물·지문
  max_sentence_chars: 30
review:
  rules: [사실 오류(없는 도구·기능, 틀린 이름), 참고 자료와 다른 숫자·이름, 항목 설명이 실제로 무엇을 해 주는지 구체적인가, 과장·낚시]
  banned_words: ["미쳤", "혁명적", "완벽하게", "무조건", "100%"]
templates:                 # 목록형 장면 (render/src/listicle, app/schemas/templates.py)
  - LHookClaim
  - LHookReveal
  - LItemCard
  - LChat
  - LSteps
  - LBeforeAfter
  - LTerminal
  - LStat
  - LIcon
  - LCompare
  - LRecap
  - LOutro
youtube:
  category_id: "28"
  disclosure: AI 도구로 대본과 음성을 만들었습니다
  declare_synthetic: true
voices:
  supertonic: M1
  melotts: KR
