# 앱 이미지 세 개를 테스트하고 ghcr.io 에 올린다 (아키텍처 D34, 2026-10-18).
# main 에 push 하면: 가벼운 테스트 → 이미지 빌드 → 이미지 안에서 테스트 → ghcr.io/farfromseoul/minibatch-*:<커밋 7자리>
# 배포는 여기서 하지 않는다. 개발 PC 에서 minibatch-infra/scripts/deploy.sh <태그> (맥미니는 공유기 안이라 GitHub 이 닿지 않는다)
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "poc/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: n8n 판단 코드 테스트
        run: node --test workflows/*.test.mjs
      - name: Codex 중계기 테스트 (표준 라이브러리만)
        working-directory: llm-bridge
        run: python3 -m unittest -v test_codex_bridge

  images:
    needs: checks
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: job-api
            dir: job-api
            tests: tests:/app/tests
            run: python -m unittest discover -s tests -t .
          - name: tts-worker
            dir: tts-worker
            tests: tests:/app/tests
            run: python -m unittest discover -s tests -t .
          - name: render-worker
            dir: render
            tests: test:/app/test
            run: sh -c 'npx tsc -p . && node --test "test/**/*.test.mts"'
    env:
      IMAGE: ghcr.io/farfromseoul/minibatch-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - name: 태그 (커밋 7자리)
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: 빌드 (테스트하려고 로컬에 싣는다)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.dir }}
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: 이미지 안에서 테스트
        run: |
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/${{ matrix.dir }}/${{ matrix.tests }}:ro" \
            "$IMAGE:${{ steps.tag.outputs.tag }}" ${{ matrix.run }}
      - name: ghcr.io 로그인
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 올리기
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
